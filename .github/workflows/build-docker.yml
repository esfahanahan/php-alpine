name: Build Docker Images
on:
  schedule:
    # Rebuild so minor tags follow the PHP patch currently published on Docker Hub.
    - cron: "0 2 * * *"
  push:
    branches: [master]
    paths:
      - '.github/**'
      - 'docker/**'
      - 'fs/**'
  pull_request:
    paths:
      - '.github/**'
      - 'docker/**'
      - 'fs/**'
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: true
      matrix:
        version: ["8.2", "8.3", "8.4", "8.5"]
        variant: ["mysql", "mysql-nginx", "pgsql", "pgsql-nginx"]
    name: ${{ matrix.version }} ${{ matrix.variant }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve PHP patch version
        id: php
        env:
          PHP_MINOR: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          case "$VARIANT" in
            *-nginx) flavor=fpm ;;
            *) flavor=cli ;;
          esac
          base="php:${PHP_MINOR}-${flavor}-alpine3.24"
          docker pull --platform linux/amd64 "$base"
          patch="$(docker run --rm --platform linux/amd64 "$base" php -r 'echo PHP_VERSION;')"
          if [ -z "$patch" ]; then
            echo "Failed to resolve PHP version from ${base}"
            exit 1
          fi
          echo "patch=${patch}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${PHP_MINOR}-${VARIANT}"
            if [ "$patch" != "$PHP_MINOR" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${patch}-${VARIANT}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ${base} to ${patch}"

      - name: Extract image description from Dockerfile
        id: desc
        env:
          PATCH: ${{ steps.php.outputs.patch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          file="docker/php-${VARIANT}.Dockerfile"
          DESC=$(grep -i 'org.opencontainers.image.description=' "$file" | cut -d= -f2- | sed 's/^"\(.*\)"$/\1/')
          TITLE=$(grep -i 'org.opencontainers.image.title=' "$file" | cut -d= -f2- | sed 's/^"\(.*\)"$/\1/')
          DESC="${DESC//\$\{PHP_VERSION\}/$PATCH}"
          TITLE="${TITLE//\$\{PHP_VERSION\}/$PATCH}"
          echo "desc=$DESC" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ steps.desc.outputs.title }}
            org.opencontainers.image.description=${{ steps.desc.outputs.desc }}
            org.opencontainers.image.vendor=Esfahan Ahan Apadana
            org.opencontainers.image.authors=Hossein Hosni <hosni@esfahanahan.com>
            org.opencontainers.image.source=https://github.com/esfahanahan/php-alpine
            org.opencontainers.image.version=${{ steps.php.outputs.patch }}
          annotations: |
            org.opencontainers.image.title=${{ steps.desc.outputs.title }}
            org.opencontainers.image.description=${{ steps.desc.outputs.desc }}
            org.opencontainers.image.vendor=Esfahan Ahan Apadana
            org.opencontainers.image.authors=Hossein Hosni <hosni@esfahanahan.com>
            org.opencontainers.image.source=https://github.com/esfahanahan/php-alpine
            org.opencontainers.image.version=${{ steps.php.outputs.patch }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: docker/php-${{ matrix.variant }}.Dockerfile
          context: .
          build-args: |
            PHP_VERSION=${{ matrix.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.php.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ env.GITHUB_REF_NAME }}-${{ matrix.version }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ env.GITHUB_REF_NAME }}-${{ matrix.version }}-${{ matrix.variant }}
